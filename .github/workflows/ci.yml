name: CakeStore CI/CD

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cake_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >
          --health-cmd="pg_isready -U postgres -d cake_platform"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/cake_platform
      DB_USERNAME: postgres
      DB_PASSWORD: password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Testcontainers PostgreSQL Integration Test
        working-directory: backend
        run: |
          set -eo pipefail
          mvn test -Dtest=AdminProvisioningPostgresIntegrationTest 2>&1 | tee testcontainers.log
          echo "=== SUREFIRE TXT OUTPUT ==="
          for f in target/surefire-reports/*.txt; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              cat "$f"
              echo "### Report: $f" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              cat "$f" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Publish Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-test-reports
          path: |
            backend/target/surefire-reports/**
            backend/testcontainers.log
          if-no-files-found: warn

      - name: Build Docker image
        run: docker build -t cakestore-api:${{ github.sha }} ./backend


  push-image:
    name: Push Image to Azure Container Registry
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name crcakestoreprod

      - name: Build Docker image
        run: |
          docker build \
            -t crcakestoreprod.azurecr.io/cakestore-api:${{ github.sha }} \
            -t crcakestoreprod.azurecr.io/cakestore-api:latest \
            ./backend

      - name: Push Docker image
        run: |
          docker push crcakestoreprod.azurecr.io/cakestore-api:${{ github.sha }}
          docker push crcakestoreprod.azurecr.io/cakestore-api:latest

      - name: Verify image in ACR
        run: |
          az acr repository show \
            --name crcakestoreprod \
            --image cakestore-api:${{ github.sha }} \
            --output table
