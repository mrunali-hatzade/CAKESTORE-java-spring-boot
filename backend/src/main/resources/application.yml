spring:
  application:
    name: cake-platform-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cake_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:30000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      connection-timeout: ${DB_POOL_CONN_TIMEOUT:20000}

  jpa:
    hibernate:
      ddl-auto: validate # We use Flyway for migrations
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  # Allow uploads up to 25MB for review videos (controller validates images at 5MB and videos at 25MB)
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

  jackson:
    serialization:
      fail-on-empty-beans: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:45f4f9e809b96ece4dc9605067190fe487d40b41e2f701098420bdfa4739f82b}
  expiration: ${JWT_EXPIRATION_MS:86400000}

app:
  sms:
    log-payloads: true
  demo-data:
    enabled: ${APP_DEMO_DATA_ENABLED:true}
  business:
    default-timezone: ${APP_TIMEZONE:Asia/Kolkata}
  storage:
    provider: ${APP_STORAGE_PROVIDER:local}
  geocoding:
    enabled: ${GEOCODING_ENABLED:true}
    provider: ${GEOCODING_PROVIDER:nominatim}
    endpoint: ${GEOCODING_ENDPOINT:https://nominatim.openstreetmap.org/search}
    timeout-ms: ${GEOCODING_TIMEOUT_MS:3000}
    user-agent: ${GEOCODING_USER_AGENT:CakeStore-Platform/1.0}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}

azure:
  storage:
    account-name: ${AZURE_STORAGE_ACCOUNT_NAME:devstoreaccount1}
    public-container-name: ${AZURE_STORAGE_PUBLIC_CONTAINER:cakestore-public}
    private-container-name: ${AZURE_STORAGE_PRIVATE_CONTAINER:cakestore-private}
  client-id: ${AZURE_CLIENT_ID:}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

mail:
  admin-notification-email: ${APP_ADMIN_DEFAULT_EMAIL:admin@cakeplatform.com}
  from-address: ${MAIL_FROM_ADDRESS:onboarding@resend.dev}
  resend:
    api-key: ${RESEND_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
