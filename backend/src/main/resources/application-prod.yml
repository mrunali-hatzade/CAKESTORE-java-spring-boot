spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:30000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      connection-timeout: ${DB_POOL_CONN_TIMEOUT:20000}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  mail:
    host: ${SPRING_MAIL_HOST:smtp.resend.com}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:resend}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

server:
  port: ${PORT:8080}
  # ForwardedHeaderFilter enables request.getRemoteAddr() to reflect X-Forwarded-For client IP.
  # Security Trust Boundary: Upstream reverse proxy (Nginx, Cloudflare, App Gateway) MUST strip/overwrite
  # untrusted incoming X-Forwarded-For headers to prevent client IP spoofing.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

app:
  storage:
    provider: ${APP_STORAGE_PROVIDER:azure_blob}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

azure:
  storage:
    account-name: ${AZURE_STORAGE_ACCOUNT_NAME}
    public-container-name: ${AZURE_STORAGE_PUBLIC_CONTAINER}
    private-container-name: ${AZURE_STORAGE_PRIVATE_CONTAINER}
  client-id: ${AZURE_CLIENT_ID:}

razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}

file:
  upload-dir: ${FILE_UPLOAD_DIR:/var/lib/cakestore/uploads}

logging:
  level:
    root: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    com.cakeplatform.api: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

